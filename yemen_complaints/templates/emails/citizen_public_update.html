<div style="direction:rtl;font-family:Tahoma,Arial,sans-serif;color:#1f2937;line-height:1.9;">
  <div style="background:linear-gradient(135deg,#1d4ed8,#2563eb);padding:18px;border-radius:16px;color:#fff;">
    <div style="font-size:20px;font-weight:800;">تحديث جديد على طلبك</div>
    <div style="font-size:13px;margin-top:6px;opacity:.92;">{{ doc.name }}</div>
  </div>
  <div style="padding:18px 4px;">
    <p>ورد تحديث جديد على طلبك بعنوان <b>{{ doc.subject }}</b>.</p>
    <div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:14px;padding:12px;">
      {{ update_row.message }}
    </div>
    <p style="margin-top:12px;"><b>الحالة الحالية:</b> {{ doc.status }}</p>
  </div>
</div>
