{% macro cell(label, value) -%}
<div style="padding:10px 12px;border:1px solid #e5e7eb;border-radius:10px;background:#fff;min-height:54px;">
  <div style="font-size:11px;color:#6b7280;margin-bottom:4px;">{{ label }}</div>
  <div style="font-size:13px;font-weight:700;color:#111827;">{{ value or '—' }}</div>
</div>
{%- endmacro %}
